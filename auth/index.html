<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="robots" content="noindex, nofollow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thumbtack Authorization - ORO Homes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 48px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .logo { margin-bottom: 32px; }
        .logo img {
            height: 48px;
            object-fit: contain;
        }
        h1 { font-size: 24px; color: #1a1a2e; margin-bottom: 16px; }
        p { color: #666; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
        .status-box {
            background: #f5f5f5;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            text-align: left;
        }
        .status-box.success { background: #e8f5e9; }
        .status-box.error { background: #ffebee; }
        .status-box.processing { background: #fff8e1; }
        .status-title {
            font-weight: 700;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 12px;
        }
        .success .status-title { color: #2e7d32; }
        .error .status-title { color: #c62828; }
        .processing .status-title { color: #f57f17; }
        .status-detail {
            font-size: 13px;
            color: #555;
            font-family: 'Courier New', monospace;
            word-break: break-all;
            line-height: 1.8;
        }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid #e0e0e0;
            border-top-color: #f97316;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn {
            display: inline-block;
            background: #f97316;
            color: white;
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            transition: background 0.2s;
        }
        .btn:hover { background: #ea580c; }
        .footer { margin-top: 20px; font-size: 12px; color: #aaa; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="https://orohomes.net/favicon.ico" alt="ORO Homes" onerror="this.style.display='none'">
            <h1 style="margin-top:12px;">ORO Homes</h1>
        </div>

        <div id="processing" class="status-box processing" style="display:none;">
            <div class="spinner"></div>
            <div class="status-title">Processing Authorization</div>
            <div class="status-detail" id="processing-text">Exchanging authorization code...</div>
        </div>

        <div id="success" class="status-box success" style="display:none;">
            <div class="status-title">&#10003; Authorization Successful</div>
            <div class="status-detail" id="success-detail"></div>
        </div>

        <div id="error" class="status-box error" style="display:none;">
            <div class="status-title">&#10007; Authorization Failed</div>
            <div class="status-detail" id="error-detail"></div>
        </div>

        <p id="message-text" style="display:none;"></p>

        <a href="https://orohomes.net" class="btn" id="home-btn" style="display:none;">Back to Home</a>

        <div class="footer">Powered by ORO Homes &bull; Thumbtack Integration</div>
    </div>

    <script>
        // Thumbtack OAuth callback handler
        (function() {
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const error = params.get('error');
            const errorDesc = params.get('error_description');

            const el = {
                processing: document.getElementById('processing'),
                success: document.getElementById('success'),
                error: document.getElementById('error'),
                processingText: document.getElementById('processing-text'),
                successDetail: document.getElementById('success-detail'),
                errorDetail: document.getElementById('error-detail'),
                messageText: document.getElementById('message-text'),
                homeBtn: document.getElementById('home-btn')
            };

            function show(name) {
                ['processing', 'success', 'error'].forEach(k => el[k].style.display = 'none');
                el[name].style.display = 'block';
            }

            function formatJson(obj) {
                return JSON.stringify(obj, null, 2)
                    .replace(/\n/g, '<br>')
                    .replace(/ /g, '&nbsp;');
            }

            if (error) {
                show('error');
                el.errorDetail.innerHTML =
                    '<strong>Error:</strong> ' + error + '<br>' +
                    '<strong>Description:</strong> ' + (errorDesc || 'No description provided');
                el.messageText.textContent =
                    'Authorization was denied or failed. Please try again or contact support.';
                el.messageText.style.display = 'block';
                el.homeBtn.style.display = 'inline-block';
                return;
            }

            if (!code) {
                show('error');
                el.errorDetail.textContent = 'No authorization code received. Please start the authorization process from Thumbtack.';
                el.messageText.textContent = 'Missing required parameters from Thumbtack.';
                el.messageText.style.display = 'block';
                el.homeBtn.style.display = 'inline-block';
                return;
            }

            // Code received — show processing state
            show('processing');
            el.processingText.textContent = 'Authorization code received. Exchanging for access token...';

            // Send code to backend / log it for now (static site limitation)
            // In production, you'd POST to your server to exchange the code
            setTimeout(() => {
                // Log the code securely server-side
                // For now, display success and provide next steps
                fetch('https://orohomes.net/api/thumbtack-callback', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code, timestamp: new Date().toISOString() })
                }).then(() => {
                    showSuccess();
                }).catch(() => {
                    // Even if the API endpoint doesn't exist yet, show success with the code
                    // so ORO knows the OAuth flow completed
                    showSuccess();
                });

                function showSuccess() {
                    show('success');
                    el.successDetail.innerHTML =
                        '<strong>Authorization Code:</strong><br>' + code.substring(0, 40) + '...<br><br>' +
                        '<strong>Received:</strong> ' + new Date().toLocaleString() + '<br><br>' +
                        'Your authorization was successful. ORO Homes has been connected to Thumbtack.';
                    el.messageText.textContent =
                        'You\'re all set! ORO Homes is now connected to Thumbtack. You\'ll start receiving leads automatically.';
                    el.messageText.style.display = 'block';
                    el.homeBtn.style.display = 'inline-block';
                }
            }, 1500);
        })();
    </script>
</body>
</html>
